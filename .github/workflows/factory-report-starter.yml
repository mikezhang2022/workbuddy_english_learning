name: factory-report-starter CI

on:
  push:
    paths:
      - "factory-report-starter/**"
      - ".github/workflows/factory-report-starter.yml"
  pull_request:
    paths:
      - "factory-report-starter/**"
      - ".github/workflows/factory-report-starter.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory-report-starter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FactoryReport.sln

      - name: Build
        run: dotnet build FactoryReport.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FactoryReport.sln --no-build --configuration Release --verbosity normal
